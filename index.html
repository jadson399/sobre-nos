<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Entre Nós</title>
<style>
body{
background:#111;
color:white;
font-family:Arial;
max-width:700px;
margin:auto;
padding:20px;
}
textarea,input{
width:100%;
padding:10px;
margin:10px 0;
}
button{
padding:10px;
}
</style>
</head>
<body>

<h1>Entre Nós</h1>

<input id="email" placeholder="Email">
<input id="senha" type="password" placeholder="Senha">
<button onclick="login()">Entrar</button>

<hr>

<h2 id="pergunta"></h2>

<textarea id="texto"></textarea>

<button onclick="enviar()">Enviar</button>

<div id="resultado"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
updateDoc,
onSnapshot
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyBk6sc2AogfstSaSdlSnHFzbrVXGxuKLhc",
authDomain: "projeto-jad-rafa.firebaseapp.com",
projectId: "projeto-jad-rafa",
storageBucket: "projeto-jad-rafa.firebasestorage.app",
messagingSenderId: "147305981928",
appId: "1:147305981928:web:e513ca57acb9841a8e265d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let eu = "";

async function login(){

const email =
document.getElementById("email").value;

const senha =
document.getElementById("senha").value;

await signInWithEmailAndPassword(
auth,
email,
senha
);

eu = email.includes("jadson")
? "jadson"
: "rafaela";

}

async function enviar(){

const texto =
document.getElementById("texto").value;

const ref =
doc(db,"shared","main");

const snap =
await getDoc(ref);

const dados =
snap.data();

dados[eu] = texto;

dados.revealReady =
dados.jadson &&
dados.rafaela;

await updateDoc(ref,dados);

}

onSnapshot(
doc(db,"shared","main"),
(snap)=>{

const d = snap.data();

document.getElementById(
"pergunta"
).innerText =
d.pergunta;

if(
d.revealReady
){

const outro =
eu==="jadson"
? d.rafaela
: d.jadson;

document.getElementById(
"resultado"
).innerHTML =
"<h3>Resposta dela:</h3>"
+ outro;

}

}
);

</script>

</body>
</html>
