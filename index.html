<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Em Manutenção</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0b0d12;
    color:#ffffff;
    font-family:Inter, Arial, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    max-width:700px;
    text-align:center;
    padding:50px 40px;
    background:#151922;
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.status{
    display:inline-block;
    padding:8px 16px;
    border-radius:999px;
    background:rgba(217,185,120,.12);
    color:#d9b978;
    border:1px solid rgba(217,185,120,.25);
    margin-bottom:24px;
    font-size:14px;
}

h1{
    font-size:clamp(2rem,5vw,3.5rem);
    margin-bottom:20px;
}

p{
    color:#b5b8c0;
    line-height:1.8;
    font-size:1rem;
}

.footer{
    margin-top:30px;
    color:#80848f;
    font-size:.9rem;
}
</style>
</head>

<body>

<div class="container">
    
    <div class="status">
        SISTEMA TEMPORARIAMENTE INDISPONÍVEL
    </div>

    <h1>Em Manutenção</h1>

    <p>
        Estamos realizando atualizações e melhorias para oferecer uma experiência
        mais estável, segura e eficiente.
    </p>

    <br>

    <p>
        Durante este período, o acesso ao sistema encontra-se temporariamente
        indisponível.
    </p>

    <div class="footer">
        Agradecemos sua compreensão.<br>
        Retornaremos em breve.
    </div>

</div>

</body>
</html>
